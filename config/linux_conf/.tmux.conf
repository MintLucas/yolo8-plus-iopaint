tmux source ~/.tmux.conf
# === Tmux 基础优化配置 ===

# 1. 开启鼠标支持 (点击切换窗格，拖动调整大小，滚轮翻页)
set -g mouse on

# 2. 增加历史记录行数 (默认只有2000行，跑训练日志一多就看不到了)
set -g history-limit 50000

# 3. 重新加载配置的快捷键 (修改本文件后，按 Prefix + r 立刻生效)
bind r source-file ~/.tmux.conf \; display "配置已重载!"

# 4. 让颜色显示更正常
set -g default-terminal "screen-256color"