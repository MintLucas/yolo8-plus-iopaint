server 10.78.9.45:8502 weight=1 max_fails=2 fail_timeout=30s;
server 10.78.9.45:8503 weight=1 max_fails=2 fail_timeout=30s;
server 10.78.9.45:8504 weight=1 max_fails=2 fail_timeout=30s;
server 10.78.9.45:8505 weight=1 max_fails=2 fail_timeout=30s;
server 10.78.9.45:8506 weight=1 max_fails=2 fail_timeout=30s;
server 10.78.9.45:8507 weight=1 max_fails=2 fail_timeout=30s;
server 10.136.234.255:8500 weight=1 max_fails=2 fail_timeout=30s;
server 10.136.234.255:8501 weight=1 max_fails=2 fail_timeout=30s;
server 10.136.234.255:8502 weight=1 max_fails=2 fail_timeout=30s;
server 10.136.234.255:8503 weight=1 max_fails=2 fail_timeout=30s;
server 10.136.234.255:8504 weight=1 max_fails=2 fail_timeout=30s;
server 10.136.234.255:8505 weight=1 max_fails=2 fail_timeout=30s;
