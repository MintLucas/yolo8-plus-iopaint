#server 10.54.29.209:1126 weight=1 max_fails=2 fail_timeout=30s;
#server 10.54.29.210:1126 weight=1 max_fails=3 fail_timeout=30s;
#server 10.54.29.210:5001 weight=1 max_fails=2 fail_timeout=30s;
keepalive 10;
}

log_format  mask_server_log  '客户端:$remote_addr 请求耗时:$request_time 转发到:$upstream_addr  时间: [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';


server{
listen 8500;
server_name mask_server;
access_log /data0/jiangtao16/nginx/log/mask_server.log mask_server_log;
location / {
 proxy_buffers 3 100m;
 proxy_connect_timeout 180s;
 proxy_read_timeout 180s;
 client_max_body_size 50m;
 proxy_buffer_size 50m;
 proxy_pass http://mask_server;
 proxy_set_header Connection "";
 proxy_buffering off;
}
}


