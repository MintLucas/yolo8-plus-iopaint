upstream message_api {
server 10.182.8.173:3126 weight=1 max_fails=2 fail_timeout=35000s;
}
log_format  message_log  '客户端:$remote_addr 请求耗时:$request_time 转发到:$upstream_addr  时间: [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
server{
listen 3127;
server_name message_api;
access_log /data0/jiangtao16/nginx/log/message_auto.log message_log;
location / {
 proxy_buffers 3 100m;
 proxy_connect_timeout 180s;
 proxy_read_timeout 180s;
 client_max_body_size 500m;
 proxy_buffer_size 50m;
 proxy_pass http://message_api;
 #proxy_buffering off;
}
}

